name: Daily AI Papers Newsletter

on:
  schedule:
    - cron: "17 1 * * *"  # runs daily at 01:17 UTC
  workflow_dispatch:
    inputs:
      sample_issue:
        description: "Create the bundled sample as a Buttondown draft"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-ai-papers-newsletter
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run newsletter generator
        if: ${{ github.event_name == 'schedule' || !inputs.sample_issue }}
        env:
          API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ENDPOINT: "https://openrouter.ai/api/v1/chat/completions"
          MODEL: "deepseek/deepseek-v3.2"
          OUTPUT_DIR: "newsletter"
          MAX_CHARS: "80000"
          TOP_PAPERS_COUNT: "5"
          MIN_SUCCESSFUL_PAPERS: "5"
          NEWSLETTER_NAME: "Daily AI Papers"
          NEWSLETTER_SERVICE: "buttondown"
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          BUTTONDOWN_STATUS: "draft"
          PYTHONPATH: "src"
        run: |
          python -m selfletter.cli

      - name: Create Buttondown sample draft
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sample_issue }}
        env:
          NEWSLETTER_NAME: "Daily AI Papers"
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          PYTHONPATH: "src"
        run: |
          python -m selfletter.sample

      - name: Save generated newsletter
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-${{ github.run_id }}
          path: newsletter/
          if-no-files-found: ignore
          retention-days: 14
