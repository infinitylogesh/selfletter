name: Daily AI Papers Newsletter

on:
  schedule:
    - cron: "00 1 * * *"  # runs daily at 01:00 UTC
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run newsletter generator
        env:
          API_KEY: ${{ secrets.API_KEY }}
          ENDPOINT: "https://openrouter.ai/api/v1/chat/completions"
          MODEL: "deepseek/deepseek-chat"
          OUTPUT_DIR: "newsletter"
          TOP_PAPERS_COUNT: "5"
          NEWSLETTER_NAME: "Daily AI Papers"
          NEWSLETTER_SERVICE: "email"
          SMTP_HOST: "smtp.gmail.com"
          SMTP_PORT: "465"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # Uncomment below for Kit.com instead of email
          # NEWSLETTER_SERVICE: "kit"
          # KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          PYTHONPATH: "src"
        run: |
          python -m selfletter.cli
